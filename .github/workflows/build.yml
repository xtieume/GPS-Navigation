name: Build
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-latest
    strategy:
      matrix:
        scheme: [rootless, rootful]
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          brew install ldid dpkg make
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
      - name: Build package
        env:
          THEOS: /Users/runner/theos
          SCHEME: ${{ matrix.scheme }}
        run: |
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          if [ "$SCHEME" = rootless ]; then make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless; else make package FINALPACKAGE=1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: GPSNav-${{ matrix.scheme }}
          path: packages/*.deb
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: GPSNav-*
          path: packages
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*.deb
  sileo-repo:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: GPSNav-*
          path: repo/debs
          merge-multiple: true
      - name: Build APT index
        working-directory: repo
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq dpkg-dev apt-utils
          dpkg-scanpackages -m debs /dev/null > Packages
          bzip2 -kf Packages && gzip -kf Packages && xz -kf Packages
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="GPSNav" \
            -o APT::FTPArchive::Release::Label="GPSNav" \
            -o APT::FTPArchive::Release::Suite="stable" \
            -o APT::FTPArchive::Release::Version="1.0" \
            -o APT::FTPArchive::Release::Codename="ios" \
            -o APT::FTPArchive::Release::Architectures="iphoneos-arm iphoneos-arm64" \
            -o APT::FTPArchive::Release::Components="main" \
            -o APT::FTPArchive::Release::Description="GPSNav tweak repository" \
            release . > Release
          cp ../site/* .
      - uses: actions/upload-pages-artifact@v3
        with:
          path: repo
      - id: deploy
        uses: actions/deploy-pages@v4
