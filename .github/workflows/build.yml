name: Build
on:
  push:
    tags: ['v*']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  package:
    # ponytail: one macOS job builds both schemes; hosted macOS arm64 capacity is scarce and a second matrix job often never gets a runner
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          brew install ldid dpkg make
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
      - name: Build packages
        env:
          THEOS: /Users/runner/theos
        run: |
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          make clean package FINALPACKAGE=1
          ls -l packages
      - uses: actions/upload-artifact@v4
        with:
          name: GPSNav-debs
          path: packages/*.deb
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: GPSNav-*
          path: packages
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*.deb
  sileo-repo:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: GPSNav-*
          path: repo/debs
          merge-multiple: true
      - name: Build APT index
        working-directory: repo
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq dpkg-dev apt-utils
          dpkg-scanpackages -m debs /dev/null > Packages
          bzip2 -kf Packages && gzip -kf Packages && xz -kf Packages
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="GPSNav" \
            -o APT::FTPArchive::Release::Label="GPSNav" \
            -o APT::FTPArchive::Release::Suite="stable" \
            -o APT::FTPArchive::Release::Version="1.0" \
            -o APT::FTPArchive::Release::Codename="ios" \
            -o APT::FTPArchive::Release::Architectures="iphoneos-arm iphoneos-arm64" \
            -o APT::FTPArchive::Release::Components="main" \
            -o APT::FTPArchive::Release::Description="GPSNav tweak repository" \
            release . > Release
          cp ../site/* .
      - uses: actions/upload-pages-artifact@v3
        with:
          path: repo
      - id: deploy
        uses: actions/deploy-pages@v4
