name: Build
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-latest
    strategy:
      matrix:
        scheme: [rootless, rootful]
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          brew install ldid dpkg make
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
      - name: Build package
        env:
          THEOS: /Users/runner/theos
          SCHEME: ${{ matrix.scheme }}
        run: |
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          if [ "$SCHEME" = rootless ]; then make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless; else make package FINALPACKAGE=1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: GPSNav-${{ matrix.scheme }}
          path: packages/*.deb
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: GPSNav-*
          path: packages
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*.deb
